name: Server CD

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: "Release version label (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      scan_path: server
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build_release:
    name: Build Server Release Artifact
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build server jar
        run: ./gradlew clean bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bif-server:${{ inputs.version_number }}
            ghcr.io/${{ github.repository_owner }}/bif-server:${{ github.sha }}

      - name: Prepare versioned artifact
        run: |
          mkdir -p release
          cp build/libs/*.jar release/server-${{ inputs.version_number }}.jar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ inputs.version_number }}
          path: server/release/server-${{ inputs.version_number }}.jar
