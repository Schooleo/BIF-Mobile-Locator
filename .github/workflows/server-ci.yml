name: Server CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: ["dev", "main"]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/security.yml"

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      scan_path: server
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  checkstyle:
    name: Server Checkstyle
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  test_and_coverage:
    name: Server Test & Coverage
    needs: [security, checkstyle]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests and coverage gate
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification

      - name: Publish JaCoCo test report
        if: always()
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/server/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Server JaCoCo Coverage
          min-coverage-overall: 70
          min-coverage-changed-files: 70
