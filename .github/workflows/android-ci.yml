name: Android CI

permissions:
  contents: read
  checks: write
  security-events: write

on:
  push:
    branches: ["dev"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/security.yml"
      
jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      scan_path: android
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  lint:
    name: Lint Check
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ./app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew lint

  unit_test:
    name: Unit Tests
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ./app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Tests
        run: ./gradlew test

      - name: Publish unit test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: android/**/build/test-results/test*/TEST-*.xml

  checkstyle:
    name: Checkstyle
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ./app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Checkstyle
        run: ./gradlew :app:checkstyleMain :app:checkstyleTest

  build:
    name: Build & Artifact
    needs: [lint, unit_test, checkstyle]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ./app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > ./local.properties
          echo "PLACES_API_KEY=${{ secrets.PLACES_API_KEY }}" >> ./local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PBUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BIF-Locator.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIF-Locator
          path: android/app/build/outputs/apk/debug/BIF-Locator.apk

