name: Android CI

on:
  push:
    branches: ["dev"]
    paths:
      - "android/**"
      - ".github/workflows/android-dev.yml"
      - ".github/workflows/code-quality.yml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "android/**"
      - ".github/workflows/android-dev.yml"
      - ".github/workflows/code-quality.yml"
      - ".github/workflows/security.yml"
      
jobs:
  security:
    uses: ./.github/workflows/security.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  check_quality:
    needs: security
    uses: ./.github/workflows/code-quality.yml
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  checkstyle:
    name: Checkstyle
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ./app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Checkstyle
        run: ./gradlew :app:checkstyleMain :app:checkstyleTest

  build:
    name: Build & Artifact
    needs: [check_quality, checkstyle]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ./app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > ./local.properties
          echo "PLACES_API_KEY=${{ secrets.PLACES_API_KEY }}" >> ./local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PBUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BIF-Locator.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIF-Locator
          path: android/app/build/outputs/apk/debug/BIF-Locator.apk

