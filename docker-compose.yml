services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale-router
    profiles:
      - tailscale
    network_mode: "service:bif-server"
    environment:
      TS_HOSTNAME: "${TS_HOSTNAME:-bif-server}"
      TS_AUTHKEY: "${TS_AUTHKEY}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    restart: unless-stopped

  bif-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bif-server-dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MONGODB_URI: mongodb://admin:pass@mongodb:27017/bif_db?authSource=admin
      PLACE_SEARCH_PROVIDER: ${PLACE_SEARCH_PROVIDER:-mongo}
      TYPESENSE_ENABLED: ${TYPESENSE_ENABLED:-false}
      TYPESENSE_PROTOCOL: http
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key}
      TYPESENSE_BOOTSTRAP_REINDEX_ON_STARTUP: ${TYPESENSE_BOOTSTRAP_REINDEX_ON_STARTUP:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: bif-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
          "mongodb://admin:pass@localhost:27017/admin",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    profiles:
      - express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_URL: mongodb://admin:pass@mongodb:27017/
    depends_on:
      - mongodb

  typesense:
    image: typesense/typesense:30.1
    container_name: bif-typesense
    profiles:
      - typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-dev-typesense-key}
      --enable-cors
    volumes:
      - typesense_data:/data

volumes:
  mongo_data:
  typesense_data:
