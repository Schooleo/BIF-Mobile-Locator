spring.application.name=server
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://admin:pass@localhost:27017/bif_db?authSource=admin}
spring.data.mongodb.auto-index-creation=false
spring.docker.compose.enabled=false
server.port=8080

security.jwt.secret=ChangeMeToALongerJwtSecretKeyForDevOnly123456789
security.jwt.access-token-expiration-seconds=3600
security.jwt.refresh-token-expiration-seconds=2592000

cloudinary.url=${CLOUDINARY_URL:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.fail-fast=${CLOUDINARY_FAIL_FAST:false}

place.geocoding.enabled=true
place.geocoding.base-url=https://nominatim.openstreetmap.org
place.geocoding.user-agent=bif-mobile-app-server/1.0
routing.osrm.base-url=${OSRM_BASE_URL:http://localhost:5000}
place.search.provider=${PLACE_SEARCH_PROVIDER:mongo}
place.search.default-source=osm_geocoder

typesense.enabled=${TYPESENSE_ENABLED:false}
typesense.protocol=${TYPESENSE_PROTOCOL:http}
typesense.host=${TYPESENSE_HOST:localhost}
typesense.port=${TYPESENSE_PORT:8108}
typesense.api-key=${TYPESENSE_API_KEY:}
typesense.places-collection=${TYPESENSE_PLACES_COLLECTION:places}
typesense.connect-timeout-ms=${TYPESENSE_CONNECT_TIMEOUT_MS:3000}
typesense.read-timeout-ms=${TYPESENSE_READ_TIMEOUT_MS:5000}
typesense.bootstrap-reindex-on-startup=${TYPESENSE_BOOTSTRAP_REINDEX_ON_STARTUP:false}

ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:llama3.1}
ai.ollama.timeout-ms=${AI_OLLAMA_TIMEOUT_MS:65000}
ai.ollama.retry-count=${AI_OLLAMA_RETRY_COUNT:1}
ai.ollama.temperature=${AI_OLLAMA_TEMPERATURE:0.1}
ai.guard.auth-required=${AI_GUARD_AUTH_REQUIRED:true}
ai.guard.max-requests-per-window=${AI_GUARD_MAX_REQUESTS_PER_WINDOW:5}
ai.guard.rate-limit-window-seconds=${AI_GUARD_RATE_LIMIT_WINDOW_SECONDS:60}

app.maps-data.places-file=${MAPS_DATA_PLACES_FILE:/map-data/places.geojson}
app.maps-data.city-archive-file=${MAPS_DATA_CITY_ARCHIVE_FILE:/map-data/city-map-brouter-cache.zip}
app.bootstrap.filter.enabled=${APP_BOOTSTRAP_FILTER_ENABLED:true}
app.bootstrap.filter.vietnam-bbox.enabled=${APP_BOOTSTRAP_FILTER_VN_BBOX_ENABLED:true}
app.bootstrap.filter.tag-completeness.enabled=${APP_BOOTSTRAP_FILTER_TAG_COMPLETENESS_ENABLED:true}
app.bootstrap.filter.junk-name.enabled=${APP_BOOTSTRAP_FILTER_JUNK_NAME_ENABLED:true}
app.bootstrap.filter.dry-run=${APP_BOOTSTRAP_FILTER_DRY_RUN:false}
app.bootstrap.filter.reject-audit.enabled=${APP_BOOTSTRAP_FILTER_REJECT_AUDIT_ENABLED:true}
app.bootstrap.filter.reject-audit.file=${APP_BOOTSTRAP_FILTER_REJECT_AUDIT_FILE:/tmp/bif-bootstrap-reject-audit.log}
app.bootstrap.filter.reject-audit.max-lines=${APP_BOOTSTRAP_FILTER_REJECT_AUDIT_MAX_LINES:5000}
app.migration.favorite-v2.enabled=${APP_MIGRATION_FAVORITE_V2_ENABLED:true}
app.bootstrap.batch-size=${APP_BOOTSTRAP_BATCH_SIZE:250}
app.bootstrap.batch-write.max-attempts=${APP_BOOTSTRAP_BATCH_WRITE_MAX_ATTEMPTS:3}
app.bootstrap.batch-write.retry-backoff-ms=${APP_BOOTSTRAP_BATCH_WRITE_RETRY_BACKOFF_MS:500}
app.bootstrap.batch-write.max-backoff-ms=${APP_BOOTSTRAP_BATCH_WRITE_MAX_BACKOFF_MS:5000}
logging.level.com.bif.server.features.route=INFO
