# Disable MongoDB auto-configuration and repository scanning in tests
spring.data.mongodb.repositories.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration

# Safety net in case our mocks are somehow bypassed
spring.data.mongodb.uri=mongodb://localhost:27017/test
spring.data.mongodb.connect-timeout-ms=500
spring.data.mongodb.socket-timeout-ms=500

# Disable docker-compose in tests
spring.docker.compose.enabled=false

# Disable Typesense in tests
typesense.enabled=false
typesense.bootstrap-reindex-on-startup=false
