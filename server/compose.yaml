services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_gui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_URL: mongodb://admin:pass@mongodb:27017/
    depends_on:
      - mongodb

  typesense:
    image: typesense/typesense:30.1
    container_name: bif-server-typesense
    profiles:
      - typesense
    restart: always
    ports:
      - "8108:8108"
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-dev-typesense-key}
      --enable-cors
    volumes:
      - typesense_data:/data

volumes:
  mongo_data:
  typesense_data: