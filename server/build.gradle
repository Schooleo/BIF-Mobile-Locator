plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
}

ext {
    set('tomcat.version', '11.0.21')
}

group = 'com.bif'
version = project.hasProperty('appVersion') ? project.property('appVersion') : 'latest'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

bootJar { archiveFileName = 'app.jar' }

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    implementation 'org.apache.commons:commons-text:1.12.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.typesense:typesense-java:2.1.0'
    implementation 'com.cloudinary:cloudinary-http45:1.39.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.2'

    implementation 'tools.jackson.core:jackson-core:3.1.1'
    implementation 'tools.jackson.core:jackson-databind:3.1.1'

    implementation 'com.squareup.okio:okio-jvm:3.4.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'
    implementation 'io.netty:netty-handler:4.1.132.Final'
    implementation 'com.google.guava:guava:32.0.0-jre'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    
    developmentOnly 'tools.jackson.core:jackson-core:3.1.1'
    developmentOnly 'tools.jackson.core:jackson-databind:3.1.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        checkstyle('org.codehaus.plexus:plexus-utils:4.0.3') {
            because 'Snyk vulnerability fix for Directory Traversal'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco { toolVersion = '0.8.12' }

checkstyle {
    toolVersion = '11.0.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports { xml.required = true; html.required = true }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.70 } }
    }
}

tasks.named('check') { dependsOn tasks.named('jacocoTestCoverageVerification') }