mutation DraftTripFromQuery($query: String!) {
  draftTripFromQuery(query: $query) {
    warnings
    failureCode
    candidatePlaces {
      id
      name
      address
      rating
      location {
        latitude
        longitude
      }
    }
    draft {
      title
      summary
      stops {
        placeId
        durationMinutes
        note
        place {
          id
          name
          address
          rating
          location {
            latitude
            longitude
          }
        }
      }
    }
  }
}
