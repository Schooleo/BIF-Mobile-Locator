mutation SuggestPlacesFromQuery($query: String!) {
  suggestPlacesFromQuery(query: $query) {
    extractedKeywords
    category
    vibe
    searchQueries
    locationHint
    warnings
    failureCode
    places {
      id
      name
      address
      rating
      location {
        latitude
        longitude
      }
    }
  }
}
