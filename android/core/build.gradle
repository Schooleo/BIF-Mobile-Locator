plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.apollo)
}

android {
    namespace 'com.bif.app.core'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        minSdk 29

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDir("$buildDir/generated/source/apollo/service")
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.bcrypt
    implementation libs.apollo.java.client
    implementation libs.retrofit.core
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging
    implementation libs.hilt.android
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

apollo {
    service("service") {
        packageName.set("com.bif.app.core.network")
        generateKotlinModels.set(false)
        mapScalarToKotlinLong("Long")
    }
}

def generateApolloSourcesTask = tasks.named("generateServiceApolloSources")

tasks.withType(JavaCompile).configureEach {
    dependsOn(generateApolloSourcesTask)
}

tasks.matching { task ->
    task.name.startsWith("extract") && task.name.endsWith("Annotations")
}.configureEach {
    dependsOn(generateApolloSourcesTask)
}